[package]
name = "hive"
version = "0.2.201"
authors = ["Enoch Carter <mrenoch@gmail.com>"]
edition = "2021"
license-file = "LICENSE.txt"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
#default = []
default = ["tracing"]

bluetooth = ["bluster", "blurz", "uuid", "lazy_static", "regex"]
websock = ["websocket-codec", "base64", "sha-1"]
rest = ["reqwest"]
mqtt = ["rumqttc", "tracing-subscriber?/tracing-log"]
gui = ["slint", "crossbeam-channel", "dep:slint-build", "tracing-subscriber?/tracing-log"]

# Logging backend, see src/logging.rs. `tracing` is the default; turning
# on `log` switches Hive to the standard `log` crate, and `log` wins when
# both are on, so `features = ["log"]` is enough on its own. Add
# `default-features = false` as well to drop the tracing dependency
# entirely. Neither: logging is compiled out.
tracing = ["dep:tracing", "dep:tracing-subscriber"]
log = ["dep:log", "tracing?/log"]

[dependencies]
slint = { version="1.13", optional=true }
futures = "0.3"
#https://docs.rs/config/0.10.1/config/
toml = "1.0.1+spec-1.1.0"
# Optional logging backends, selected by the `tracing` / `log` features.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "std"] }
log = { version = "0.4.29", optional = true }
chrono = "0.4.42"
# bytes version limited to reduce duplication with bluetooth
bytes = { version = "1.10"}
local_ipaddress = "0.1"
num-traits = "0.2.19"
bluster =         {version= "0.2.0", optional=true}
uuid =            {version= "1.18.1", optional=true}
tokio = { version = "1.48.0", features = ["full", "io-util"] }
tokio-util = { version = "0.7.16" }
tokio-stream = { version = "0.1", features = ["sync"] }
lazy_static =     {version="1.5.0", optional=true}
regex =           {version="1.12.2", optional=true}
websocket-codec = { version = "0.5.2", optional = true }
base64 =          { version = "0.22.1", optional = true }
sha-1 =           { version = "0.10.1", optional = true }

crossbeam-channel = { version = "0.5", optional = true }
rumqttc = { version = "0.25", optional = true }

# rest optional dependancy
reqwest = {version= "0.13.2", optional = true, features=["json"]}
ctrlc = "3.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
blurz = { version = "0.4.0", optional = true }
# bluz is depebdent on dbus which requires libdbus-1-dev


[lib]
name = "hive"
# this is needed to build for iOS and Android.
crate-type = ["staticlib", "cdylib", "lib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }

[dev-dependencies]
# Tests and examples log through tracing directly, whatever backend the
# library itself was built with.
tracing = "0.1"

[[example]]
name = "hive_window"
required-features = ["gui"]

[build-dependencies]
slint-build = { version = "1.13", optional = true }